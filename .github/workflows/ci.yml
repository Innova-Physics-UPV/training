name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Run tests
        run: uvx pytest -v

  branch-name:
    name: branch-name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check that the branch is named nombre-apellido
        # Passed through env, never interpolated into the script: branch names are user input.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^[a-z]+(-[a-z]+)+$ ]]; then
            echo "::error::La rama '$HEAD_REF' debe ser tu nombre en minúsculas, sin tildes ni ñ, con guiones (por ejemplo marc-sanchis)."
            exit 1
          fi
